# Dev environment
variables:
  # Global
  ap_vm_image: ubuntu-20.04

  namespace: cvopx #Note: A namespace with many characters will cause storage account creation to fail due to storage account names having a limit of 24 characters.
  postfix: 0002
  location: eastus
  environment: dev
  enable_aml_computecluster: true
  enable_monitoring: false

  # Azure DevOps
  ado_service_connection_rg: Azure-ARM-Dev
  ado_service_connection_aml_ws: Azure-ARM-Dev

  # DO NOT TOUCH

  # For pipeline reference
  resource_group: rg-devt-mlopsgaather
  aml_workspace: mlw-devt-mlopsgaather
  application_insights: appi-devt-mlopsgaather
  key_vault: kv-devt-mlopsgaather
  container_registry: crdevtmlopsgaather
  storage_account: stdevtmlopsgaather

  # For terraform reference
  terraform_version: 1.3.6
  terraform_workingdir: infrastructure
  terraform_st_location: $(location)
  terraform_st_resource_group: rg-devt-mlopsgaather
  terraform_st_storage_account: stdevtmlopsgaather
  terraform_st_container_name: tfstate
  terraform_st_key: read-only
