name: azureml-cli-v2
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.8
  - yapf
  - pylint
  - pip
  - pip:
      - mlflow==2.2.2 # package version >=2.0,<3.0, somewhat arbitary but ensures package at a time after mlfow.data API was introduced and prior to Azure ML new packages
      - cloudpickle==1.6.0
      - scikit-learn==0.24.2
      - flask==1.1.2
      - applicationinsights
      - pandas
      - azureml-core
      - azureml-dataset-runtime[fuse]
      - opencensus-ext-azure
