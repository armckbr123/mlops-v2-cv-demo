schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
type: environment

name: cv-custom-train-env
version: 1.0.1


image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04

conda:
  channels:
    - conda-forge
    - defaults

dependencies:
  - python=3.8
  - pip
  - pip:
      - azureml-mlflow>=1.56.0
      - mlflow>=2.7.1,<3.0
      - torch
      - torchvision
      - cloudpickle
      - scikit-learn
      - pandas
